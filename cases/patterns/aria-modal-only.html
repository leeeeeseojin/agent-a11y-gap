<!doctype html>
<html lang="ko" data-case="aria-modal-only">
<head><meta charset="utf-8"><link rel="icon" href="data:,"><title>aria-modal만 있는 모달</title><link rel="stylesheet" href="_probe.css"></head>
<body>
<!-- MY DUGOUT 수정 전과 비슷한 상태. dialog에 aria-modal만 있고 배경은 그대로 둔다. Chrome은 aria-modal만으로 배경을 트리에서 빼지 않는다. -->
<h1>aria-modal만 있는 모달</h1>
<button data-probe="TARGET">TARGET</button>
<div class="backdrop">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="설정">
    <button data-probe="CONTROL">CONTROL</button>
  </div>
</div>
<script src="_probe.js"></script>
</body>
</html>
