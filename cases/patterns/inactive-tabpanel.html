<!doctype html>
<html lang="ko" data-case="inactive-tabpanel">
<head><meta charset="utf-8"><link rel="icon" href="data:,"><title>비활성 탭 패널</title><link rel="stylesheet" href="_probe.css"></head>
<body>
<!-- ARIA APG 탭 패턴이다. 선택되지 않은 패널은 마운트된 채 hidden으로 둔다. -->
<h1>비활성 탭 패널</h1>
<div role="tablist" aria-label="설정 탭">
  <button role="tab" id="t1" aria-selected="true" aria-controls="p1">기본</button>
  <button role="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1">고급</button>
</div>
<div role="tabpanel" id="p1" aria-labelledby="t1">
  <button data-probe="CONTROL">CONTROL</button>
</div>
<div role="tabpanel" id="p2" aria-labelledby="t2" hidden>
  <button data-probe="TARGET">TARGET</button>
</div>
<script src="_probe.js"></script>
</body>
</html>
