# 1층 매트릭스는 특정 버전에서의 값이다. 매주 두 MCP의 최신 버전으로 다시 돌려
# 커밋된 결과(runs/layer1/latest.json)와 달라진 칸을 작업 요약에 남긴다.
# 결과를 레포에 자동 커밋하지는 않는다. 달라졌으면 로컬에서 확인하고 직접 커밋한다.
name: layer1

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chrome
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e

  matrix:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chrome
      # 고정된 버전이 아니라 지금 배포된 최신 버전으로 돌린다
      - run: pnpm add -D @playwright/mcp@latest chrome-devtools-mcp@latest
      - run: cp runs/layer1/latest.json /tmp/committed.json
      - run: pnpm probe
      - name: 커밋된 결과와 비교
        run: npx tsx probe/compare.ts /tmp/committed.json runs/layer1/latest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: layer1-${{ github.run_id }}
          path: runs/layer1/
